<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>寸土必爭</title>
<style>
:root{
  --bg:#1c1712; --panel:#2a221a; --panel2:#3a2f23; --line:#54442f; --text:#f3ead8; --sub:#b7a68a;
  --gold:#f4c95d; --iron:#9fd3e6; --red:#ff6b5b; --green:#7fd16b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
input{font:inherit}
.hidden{display:none!important}

/* ---------- 大廳 ---------- */
#lobby{position:fixed;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px;gap:14px;
  background:radial-gradient(ellipse at top,#4a3a26 0%,var(--bg) 70%)}
#logo{image-rendering:pixelated;width:132px;height:138px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
#lobby h1{margin:0;font-size:36px;letter-spacing:6px;color:var(--gold);text-shadow:0 3px 0 #6b4a1e}
#lobby .tag{color:var(--sub);font-size:14px;margin-top:-6px}
.card{width:100%;max-width:400px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card label{font-size:13px;color:var(--sub)}
.inp{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:17px;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:8px}
.btn{padding:12px 14px;border-radius:10px;background:var(--panel2);font-size:16px;font-weight:700;border-bottom:3px solid rgba(0,0,0,.35)}
.btn.pri{background:#b5562c}
.btn.ok{background:#4f8a3a}
.btn:disabled{opacity:.4}
.code{font-size:44px;font-weight:800;letter-spacing:10px;text-align:center;color:var(--gold)}
.plist{display:flex;flex-direction:column;gap:6px}
.plist div{background:var(--panel2);border-radius:8px;padding:9px 12px;display:flex;justify-content:space-between}
.note{font-size:13px;color:var(--sub);line-height:1.55}
.err{color:var(--red);font-size:14px;min-height:18px}

/* ---------- 遊戲 ---------- */
#game{position:fixed;inset:0;display:flex;flex-direction:column}
#top{flex:none;background:var(--panel);border-bottom:2px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:5px;z-index:5;padding-top:max(6px,env(safe-area-inset-top))}
.res{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden}
.res small{font-size:10px;color:var(--sub);font-weight:600}
.res .f{color:var(--gold)} .res .i{color:var(--iron)}
.res .time{margin-left:auto;font-variant-numeric:tabular-nums;background:var(--panel2);border-radius:8px;padding:2px 8px}
.res .time.prep{color:var(--green)}
.res .time.hurry{color:var(--red)}
#chips{display:flex;gap:5px}
.chip{flex:1;min-width:0;background:var(--panel2);border-radius:7px;padding:2px 5px;font-size:11px;border-left:5px solid;line-height:1.35}
.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{font-size:12px}
.chip.dead{opacity:.4}
.chip.me{outline:2px solid #fff8}

#mapWrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;background:#2a2318}
#cv{display:block;margin:6px;image-rendering:pixelated;touch-action:manipulation}
.fab{position:absolute;right:10px;width:42px;height:42px;border-radius:50%;background:rgba(42,34,26,.9);border:2px solid var(--line);font-size:19px;z-index:4;display:flex;align-items:center;justify-content:center}

#panel{flex:none;background:var(--panel);border-top:2px solid var(--line);padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));height:320px;overflow-y:auto;font-size:14px}
#panel.mini{height:auto;min-height:0}
#panel .tabs{display:flex;gap:5px;margin:4px 0}
#panel .tab{flex:1;padding:9px 4px;border-radius:9px;background:var(--panel2);font-weight:800;font-size:14px;opacity:.65}
#panel .tab.on{opacity:1;outline:2px solid var(--gold)}
#panel .ab.wide{width:100%;margin-top:5px;padding:12px;font-size:16px}
#panel .hd{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;margin-bottom:4px}
#panel .sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
#panel .gar{display:flex;gap:4px 10px;font-size:14px;margin-bottom:2px;flex-wrap:wrap;color:var(--sub)}
#panel .gar b{color:var(--text)}
#panel .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
#panel .lab{font-size:12px;color:var(--sub);margin-top:6px}
.ab{padding:8px 4px;border-radius:9px;background:var(--panel2);font-size:14px;font-weight:700;line-height:1.2;border-bottom:3px solid rgba(0,0,0,.35)}
.ab small{display:block;font-size:11px;font-weight:600;color:var(--sub)}
.ab.go{background:#b5562c}
.ab.go small{color:#ffd9c2}
.ab:disabled{opacity:.38}
.sqs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:3px}
.sq{position:relative;min-height:56px;padding:6px 4px;border-radius:10px;background:var(--panel2);font-size:15px;font-weight:800;line-height:1.25;border-bottom:3px solid rgba(0,0,0,.35)}
.sq small{display:block;font-size:12px;font-weight:600;color:var(--sub)}
.sq .ck{position:absolute;left:6px;top:4px;font-size:13px}
.sq.on{background:#b5562c}
.sq.on small{color:#ffd9c2}
.sq.all{background:#3f3426;color:var(--gold)}
.hint{color:var(--sub);line-height:1.6;font-size:14px}
.warnline{color:var(--red);font-weight:700}

#toasts{position:fixed;left:0;right:0;top:92px;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:30}
.toast{background:rgba(20,15,10,.92);border:1px solid var(--line);color:#fff;padding:7px 13px;border-radius:9px;font-size:14px;max-width:90%;text-align:center;animation:tin .2s}
.toast.bad{border-color:var(--red);color:#ffc9c2}
.toast.good{border-color:var(--green);color:#d6ffc9}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
#pauseOv{position:fixed;left:0;right:0;bottom:calc(var(--ph,140px) + 70px);display:flex;justify-content:center;z-index:30;pointer-events:none;padding:0 16px}
#pauseOv .pcard{pointer-events:auto;background:rgba(28,23,18,.95);border:2px solid var(--gold);border-radius:14px;padding:12px 20px;text-align:center;font-size:18px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#pauseOv .psub{font-size:13px;color:var(--sub);margin-top:4px}
body.paused #cv{filter:brightness(.6) saturate(.7)}
.qks{display:flex;gap:5px;margin:4px 0}
.qk{flex:1;padding:7px 2px;border-radius:18px;background:#3f3426;color:var(--gold);font-weight:800;font-size:14px}
.qk.on{background:var(--gold);color:#1c1712}.qk:disabled{opacity:.4}
.sqs.c5{grid-template-columns:repeat(5,1fr);gap:4px}.sqs.c5 .sq{min-height:44px;font-size:12px;padding:3px 1px}.sqs.c5 .sq small{font-size:10px}.sqs.c5 .sq .ck{font-size:10px;left:3px;top:2px}.sqs.c5 .sqm{width:14px;height:14px}
#panel .acts4{grid-template-columns:repeat(4,1fr)}
.ab{position:relative}.ab .dot{position:absolute;right:5px;top:4px;width:9px;height:9px;border-radius:50%;background:#ff3b30;border:1.5px solid #000}
.tg{font-size:11px;padding:2px 7px;border-radius:10px;background:#3f3426;color:var(--sub);margin-right:4px;font-weight:700}.tg.on{background:#2f6b3a;color:#fff}
.needbox{background:var(--panel2);border-radius:10px;padding:6px 9px;margin:4px 0;font-size:13px}.needbox small{color:var(--sub);font-size:12px}.gold{color:var(--gold)}
.bar{height:8px;background:#000;border-radius:4px;overflow:hidden;margin:4px 0 2px}.bar i{display:block;height:100%}
.srcs{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.src{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:10px;padding:5px 8px}.src.on{outline:2px solid var(--gold)}
.src .nm{flex:1;font-weight:800;font-size:14px}.src .nm small{display:block;font-size:11px;color:var(--sub);font-weight:600}
.mini{background:#b5562c;border-radius:8px;padding:7px 9px;font-weight:800;font-size:13px;color:#fff}.mini.g{background:#3f3426;color:var(--gold)}
.sico{height:1.15em;width:auto;vertical-align:-0.2em;image-rendering:pixelated;margin-right:2px}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcol{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border-radius:10px;padding:8px}
.tpl{width:100%;background:var(--panel);border-radius:8px;padding:9px 8px;text-align:left;font-weight:700;font-size:14px;color:var(--text)}
.tpl.bot{opacity:.5;font-weight:600}
.grp{flex:1;display:flex;gap:4px;padding:4px;padding-top:9px;border-radius:9px;background:rgba(0,0,0,.25);position:relative;min-width:0}
.grp .gl{position:absolute;top:-2px;left:6px;font-size:9px;color:var(--sub)}
.vs{align-self:center;font-weight:900;color:var(--gold);font-size:12px;flex:none}
.lab2{font-size:12px;color:var(--sub);margin:6px 0 2px}
#banner{position:fixed;left:0;right:0;bottom:0;background:#a34848;color:#fff;text-align:center;padding:6px;font-size:13px;z-index:40}
.over{position:fixed;inset:0;background:rgba(10,8,5,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.over .card{max-height:88vh;overflow-y:auto}
.rank{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:8px;padding:9px 10px;font-size:15px}
.rank .no{font-size:20px;width:30px;text-align:center}
.rank .sc{margin-left:auto;font-weight:800}
#help h3{margin:4px 0;color:var(--gold);font-size:16px}
#help p,#help li{font-size:14px;line-height:1.6;margin:2px 0}
#help ul{padding-left:20px;margin:2px 0}
/* ---------- 第 10 版：玩法說明卡片 ---------- */
.helpc{position:relative;max-width:420px;min-height:470px;justify-content:space-between}
.hx{position:absolute;right:10px;top:8px;background:none;font-size:20px;color:var(--sub);padding:6px}
#hcard{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-top:8px;user-select:none}
#hcard h2{margin:0;font-size:26px;color:var(--gold);letter-spacing:2px}
#hcard .sub{color:var(--sub);font-size:15px;min-height:20px}
.hpic{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;min-height:200px}
.hpic img{image-rendering:pixelated}
.hpic .ar{font-size:26px;color:var(--gold)}
.hpic .cap{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:15px}
.hpic .tile{width:64px;height:64px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.hdots{display:flex;justify-content:center;gap:8px}
.hdots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.hdots i.on{background:var(--gold)}
.htab{width:100%;border-collapse:collapse;font-size:13px;text-align:left;margin-top:6px}
.htab td{padding:4px 6px;border-bottom:1px solid var(--line)}
/* ---------- 第 8 版：遺蹟 buff、精兵 ---------- */
#buffPick{z-index:60}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
body.wide .bgrid{grid-template-columns:repeat(4,1fr)}
body.wide #buffCard{max-width:640px}
.bcard{padding:8px 4px!important}
.bcard{background:var(--panel2);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent}
.bcard:active{border-color:var(--gold)}
.bcard:disabled{opacity:.4}
.bcard b{font-size:15px}.bcard small{font-size:12px;color:var(--sub)}
.bb{position:relative;width:52px;height:52px;border-radius:50%;background:#54442f;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:26px}
.bb i,.bm i{position:absolute;border-radius:50%;color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;border:1px solid #2a221a}
.bb i{right:-5px;bottom:-5px;width:22px;height:22px;font-size:12px}
.bm{position:relative;display:inline-flex;width:20px;height:20px;border-radius:50%;background:#54442f;border:1.5px solid var(--gold);align-items:center;justify-content:center;font-size:11px;margin-left:3px;vertical-align:middle}
.bm i{right:-4px;bottom:-4px;width:11px;height:11px;font-size:7px}
i.up{background:#3fa34d}i.dn{background:#2f7fd1}
.sq .sqm{display:block;width:18px;height:18px;margin:0 auto;image-rendering:pixelated}
.sq.el.on{background:#b5562c}
/* ---------- 第 7 版：電腦版（寬 ≥ 900、高 ≥ 500）---------- */
body.wide #game{display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto 1fr}
body.wide #top{grid-column:1 / -1}
body.wide #mapWrap{grid-column:1;grid-row:2;display:flex}
body.wide #cv{margin:auto;flex:none}
body.wide #panel,body.wide #panel.mini{grid-column:2;grid-row:2;height:auto;border-top:0;border-left:2px solid var(--line);padding:12px 14px}
body.wide .fab{right:394px}
body.wide #btnZoom{bottom:12px!important}
body.wide #btnHome{bottom:62px!important}
body.wide #btnHelp2{bottom:112px!important}
body.wide #btnPause{bottom:162px!important}
body.wide #pauseOv{bottom:20px;right:380px}
body.wide #chips{max-width:860px}
body.wide .chip{flex:0 1 200px}
body.wide .res{font-size:17px}
@media (min-height:700px) and (min-width:900px){
  body.wide #panel{font-size:16px}
  body.wide #panel .hd{font-size:18px}
  body.wide #panel .gar{font-size:15px}
  body.wide .sq{min-height:64px;font-size:17px}
  body.wide .ab{font-size:16px;padding:11px 6px}
  body.wide #panel .tab{font-size:16px;padding:11px 4px}
  body.wide .chip{font-size:13px}
  body.wide .chip b{font-size:15px}
}
@media (max-height:520px){
  body.wide #game{grid-template-columns:1fr 320px}
  body.wide .fab{right:330px;width:36px;height:36px;font-size:16px}
  body.wide #btnHome{bottom:54px!important}
  body.wide #btnHelp2{bottom:96px!important}
  body.wide #btnPause{bottom:138px!important}
  body.wide #panel{padding:8px 10px}
}
</style>
</head>
<body>

<div id="lobby">
  <canvas id="logo" width="44" height="46"></canvas>
  <h1>寸土必爭</h1>
  <div class="tag">四人即時領地攻防・一局 20 分鐘</div>
  <div class="card" id="homeCard">
    <label>你的名字</label>
    <input class="inp" id="nameInp" maxlength="8" placeholder="最多 8 個字">
    <button class="btn pri" id="btnCreate">開新房間</button>
    <div class="row">
      <input class="inp" id="codeInp" inputmode="numeric" maxlength="4" placeholder="4 位數房號" style="flex:1">
      <button class="btn ok" id="btnJoin">加入</button>
    </div>
    <label>電腦難度（單人練習、開房補位都用這個）</label>
    <select class="inp" id="diffSel"><option value="easy">簡單：5 秒想一次、不會優先打你</option><option value="normal">普通：3 秒想一次</option><option value="hard">困難：2.5 秒想一次、反應快、會圍攻</option></select>
    <label>模式（單人練習、開房都用這個）</label>
    <select class="inp" id="modeSel"><option value="ffa">混戰：四人各自為戰</option><option value="adj">2v2 合作：隊友相鄰（同一邊）</option><option value="diag">2v2 合作：隊友對角</option></select>
    <button class="btn" id="btnSolo">單人練習（對 3 個機器人）</button>
    <button class="btn hidden" id="btnResume">回到房間</button>
    <button class="btn" id="btnHelp1">玩法說明</button>
    <div class="err" id="homeErr"></div>
  </div>
  <div class="card hidden" id="waitCard">
    <label>房號（請朋友輸入這 4 個數字）</label>
    <div class="code" id="waitCode">----</div>
    <div class="note" id="waitMode" style="font-weight:700"></div>
    <div class="plist" id="waitList"></div>
    <div class="note" id="waitNote"></div>
    <button class="btn pri hidden" id="btnStart">開始遊戲</button>
    <button class="btn" id="btnLeave">離開</button>
  </div>
</div>

<div id="game" class="hidden">
  <div id="top">
    <div class="res">
      <span class="f">🌾<span id="vFood">0</span><small id="vFoodR"></small></span>
      <span class="i">⛏<span id="vIron">0</span><small id="vIronR"></small></span>
      <span>👥<span id="vPop">0</span><small id="vCap"></small></span>
      <span id="vRuin" style="display:flex;gap:6px;font-size:13px"></span>
      <span class="time" id="vTime">0:00</span>
    </div>
    <div id="chips"></div>
  </div>
  <div id="mapWrap">
    <canvas id="cv"></canvas>
  </div>
  <button class="fab" id="btnZoom" style="top:auto;bottom:calc(var(--ph,140px) + 12px)">🔍</button>
  <button class="fab" id="btnHome" style="bottom:calc(var(--ph,140px) + 62px)">🏯</button>
  <button class="fab" id="btnHelp2" style="bottom:calc(var(--ph,140px) + 112px)">？</button>
  <button class="fab hidden" id="btnPause" style="bottom:calc(var(--ph,140px) + 162px)">⏸</button>
  <div id="pauseOv" class="hidden"><div class="pcard"><b>⏸ 房主暫停中</b><div class="psub" id="pauseSub"></div><button class="btn" id="btnGo" style="margin-top:8px">▶ 繼續</button></div></div>
  <div id="panel"></div>
</div>

<div id="toasts"></div>
<div id="banner" class="hidden"></div>

<div class="over hidden" id="endScr">
  <div class="card">
    <div class="code" id="endTitle" style="font-size:30px;letter-spacing:4px"></div>
    <div class="note" id="endWhy" style="text-align:center"></div>
    <div class="plist" id="endList"></div>
    <button class="btn" id="btnStay">留下來看地圖</button>
    <button class="btn pri" id="btnEndHome">回首頁</button>
  </div>
</div>

<div class="over hidden" id="buffPick"><div class="card" id="buffCard"></div></div>

<div class="over hidden" id="help">
  <div class="card helpc">
    <button class="hx" id="btnHelpClose">✕</button>
    <div id="hcard"></div>
    <div class="hdots" id="hdots"></div>
    <div class="row"><button class="btn" id="hPrev" style="flex:1">←</button><button class="btn pri" id="hNext" style="flex:2">下一張 →</button></div>
  </div>
</div>

<script>
// ================= 遊戲規則（房主計算；也給 Node 測試用） =================
// 第 2 版：只有一種兵、10 人一隊；每塊自己的地有哨塔；城牆保護駐軍
var E = (function () {
  var N = 15, STEP = 1.2, PREP = 30, GAME = 1200, HPU = 10, ATK = 0.5, DT = 0.1;
  var SQ = 10;                 // 一隊人數
  var SQ_HP = SQ * HPU;        // 一隊滿血
  var TILE_SQ = 5;             // 每格最多隊數
  var CAP_SQ = 10;             // 主城最多隊數（第 17 版）
  var GIFT = { food: 50, iron: 30, cd: 30 };   // 第 19 版：送資源
  var TRAIN = 10;              // 訓練秒數
  // 第 8 版：精兵（打下野怪後的精兵營才能招）：每人血 15（×1.5）、攻擊 ×1.2
  var E_HPU = 15, E_ATK = 1.2, TRAIN_E = 15;
  // 第 5 版：拿掉平原；農田／礦山分 Lv1–3（產量見 LAND），這裡的 food／iron 只給主城、遺蹟用
  var INFO = {
    f: { n: '農田', food: 0, iron: 0 },
    m: { n: '礦山', food: 0, iron: 0 },
    e: { n: '精兵營', food: 0, iron: 0 },
    r: { n: '遺蹟', food: 1, iron: 0.6 },
    c: { n: '主城', food: 2, iron: 1 },
    w: { n: '野地', food: 0, iron: 0 },
    x: { n: '山', food: 0, iron: 0 }
  };
  var COST = {
    rec: 80,                   // 招一隊（糧）

    h += '<div class="qks">' + qk.map(function (c) { return '<button class="qk' + (pk2.length && sameAs(c[2]) ? ' on' : '') + '" data-a="quick" data-k="' + c[0] + '">' + c[1] + '</button>'; }).join('') + '</div>';
    h += '<div class="sqs' + (T.q.length > 5 ? ' c5' : '') + '">' + T.q.map(function (q, k) {
      return '<button class="sq' + (pickOn[q.i] ? ' on' : '') + (q.e ? ' el' : '') + '" data-a="sq" data-id="' + q.i + '"><span class="ck">' + (pickOn[q.i] ? '☑' : '☐') + '</span><img class="sqm" src="' + (q.e ? MANE_URL : MAN_URL)[o] + '">' + (q.e ? '⭐精兵' : '第' + (k + 1) + '隊') + '<small>' + E.men(q) + '/' + E.SQ + ' 人</small></button>';

function aimPanel(p, o) {
  var T = S.tiles[sel], pk = picked(), mq = myQ(sel), left = mq.length;
  var each = aimEach ? '每點一格派 <b>' + aimEach + ' 隊</b>' : '派勾選的 <b>' + pk.length + ' 隊 ' + E.menOf(pk) + ' 人</b>';
  var ch = [[0, '勾選的 ' + pk.length + ' 隊', !pk.length], [1, '每次 1 隊', false], [2, '每次 2 隊', left < 2]];
  return '<div class="hd">🚩 ' + (aimEach ? '連續出兵中' : '出兵') + '：' + each + '</div>' +
    '<div class="qks">' + ch.map(function (c) { return '<button class="qk' + (aimEach === c[0] ? ' on' : '') + '" data-a="each" data-k="' + c[0] + '"' + (c[2] ? ' disabled' : '') + '>' + c[1] + '</button>'; }).join('') + '</div>' +
    '<div class="hint" style="margin:4px 0 8px">在地圖上點 <b>白色虛線框</b> 的格子當目標' + (aimEach ? '，可以連續點好幾格' : '') + '。這格還有 ' + left + ' 隊 ' + E.menOf(mq) + ' 人。</div>' +
    '<button class="ab wide" data-a="cancel">' + (aimEach ? '完成' : '取消出兵') + '</button>';
}
// 第 17 版：點別人或無主的地 → 估算要多少兵、從附近好幾塊地一起湊兵
function estNeed(i) {
  var T = S.tiles[i], o = mySeat(), key = [i, T.o, T.t, T.lv, T.sl, Math.round(T.sh), T.w, E.hpOf(E.defQ(T)), E.defQ(T).length].join(',');
  if (estCache[key] !== undefined) return estCache[key];
  function win(n) {
    var S2 = JSON.parse(JSON.stringify(S)), T2 = S2.tiles[i], q = [], m = n, t = 0;
    while (m > 0) { var k = Math.min(E.SQ, m); q.push({ i: 900000 + q.length, h: k * E.HPU }); m -= k; }
    T2.s = [{ o: o, q: q, t0: S2.time }];
    while (T2.s && t < 900) { E.siegeTick(S2, i, 0.2); t += 0.2; }
    return T2.o === o;
  }
  var lo = 1, hi = 200;
  if (!win(hi)) { estCache = {}; estCache[key] = -1; return -1; }
  while (lo < hi) { var mid = (lo + hi) >> 1; if (win(mid)) hi = mid; else lo = mid + 1; }
  if (Object.keys(estCache).length > 30) estCache = {};
  estCache[key] = lo; return lo;
}
function allyPanel(p, o, T) {   // 第 19 版：點隊友的地＝帶走援軍、派援軍、送資源

  h += '<div class="acts" style="grid-template-columns:1fr 1fr">' + btn('gift', '🎁 送 ' + G.food + ' 糧', cf ? '冷卻 ' + cf + ' 秒' : '給 ' + esc(to.name), !cf && p.food >= G.food && to.alive, ' data-k="food"') +
    btn('gift', '🎁 送 ' + G.iron + ' 鐵', ci ? '冷卻 ' + ci + ' 秒' : '給 ' + esc(to.name), !ci && p.iron >= G.iron && to.alive, ' data-k="iron"') + '</div>';
  return h;

function supportGather(o) {

  var h = '<div class="lab2">派兵支援（從附近湊兵）</div>';

function attackPanel(p, o, T) {
  if (S.phase !== 'play') return '<div class="hint">開戰後可以從這裡湊兵攻打。</div>';

  if (!srcs.length) return h + '<div class="hint">附近沒有可以派的兵（要從相鄰的自己的地出發）。</div>';

// 選到的格子被面板蓋住或在畫面外 → 自動捲到看得見的地方
function ensureVisible(i) {

  var wrap = $('mapWrap'), r = E.rc(i), x0 = r[1] * cs + 6, y0 = r[0] * cs + 6;
  var vx = wrap.scrollLeft, vy = wrap.scrollTop, vw = wrap.clientWidth, vh = wrap.clientHeight;
